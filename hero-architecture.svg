<rect x="20" y="180" width="90" height="56" rx="8" class="box"/><text x="65" y="205" text-anchor="middle" class="t">Users</text><text x="65" y="222" text-anchor="middle" class="s">browser, mobile</text>
<rect x="175" y="110" width="110" height="52" rx="8" class="blue"/><text x="230" y="132" text-anchor="middle" class="t">CloudFront</text><text x="230" y="149" text-anchor="middle" class="s">CDN + TLS</text>
<rect x="175" y="196" width="110" height="52" rx="8" class="blue"/><text x="230" y="218" text-anchor="middle" class="t">Load balancer</text><text x="230" y="235" text-anchor="middle" class="s">ALB</text>
<rect x="330" y="150" width="200" height="130" rx="8" class="box"/><text x="345" y="172" class="t">Kubernetes cluster</text>
<rect x="345" y="188" width="50" height="34" rx="5" class="acc"/><text x="370" y="209" text-anchor="middle" style="fill:#fff;font-size:11px">pod</text>
