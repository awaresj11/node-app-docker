<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Terraform environments"><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;fill:#0E2338}.t{font-weight:600}.s{fill:#4A6179;font-size:11px}.box{fill:#fff;stroke:#0E2338;stroke-width:2}.acc{fill:#D9480F;stroke:#0E2338;stroke-width:2}.blue{fill:#DCE9F7;stroke:#1F5FA8;stroke-width:2}.ln{fill:none;stroke:#1F5FA8;stroke-width:2.5;stroke-dasharray:6 6;animation:f 1.2s linear infinite}@keyframes f{to{stroke-dashoffset:-12}}@media(prefers-reduced-motion:reduce){.ln{animation:none}}</style>
